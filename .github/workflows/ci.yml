name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the version of the "supabase" dev dependency (see package-lock.json), so CI runs the CLI a developer
          # runs locally. "latest" asked the GitHub API for the newest release on every run, and two pull requests that
          # started together hit its rate limit ("Failed to resolve latest Supabase CLI release"). Raise this together with
          # the dev dependency.
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          # mailpit stays: Auth must have a mail server to hand an invitation to, or the invitation route gets an error.
          # The smoke test never reads the mails; it takes the tokens from the admin API (generate_link).
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          # The service-role key is the one of this throwaway local stack, not a repository secret. The invitation route
          # reads it as a Worker secret (here .dev.vars), like production does.
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          # The smoke command gets the keys in its own environment, as locally.
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup
